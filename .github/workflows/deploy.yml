name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# Deployment-specific values come from repo secrets:
#   DIGITALOCEAN_ACCESS_TOKEN — DO API token
#   DO_CLUSTER_NAME           — Kubernetes cluster name
#   DO_REGISTRY               — e.g. registry.digitalocean.com/your-registry
env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  IMAGE: lilsecret
  NAMESPACE: lilsecret
  DEPLOYMENT: lilsecret-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Registry login
        run: doctl registry login --expiry-seconds 1800

      - name: Build and push image
        run: |
          set -euo pipefail
          SHA='${{ steps.meta.outputs.sha }}'
          docker build --platform linux/amd64 -t "$REGISTRY/$IMAGE:$SHA" .
          docker push "$REGISTRY/$IMAGE:$SHA"

      - name: Cluster kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Apply manifests
        run: |
          set -euo pipefail
          SHA='${{ steps.meta.outputs.sha }}'
          # Namespace must exist before the registry pull secret can land in
          # it. doctl names the secret registry-<registry-name>.
          kubectl apply -f manifests/namespace.yml
          # At-rest storage key: cut once, lives only as a Secret.
          if ! kubectl get secret lilsecret-storage -n "$NAMESPACE" >/dev/null 2>&1; then
            kubectl create secret generic lilsecret-storage -n "$NAMESPACE" \
              --from-literal=STORAGE_KEY="$(openssl rand -hex 32)"
          fi
          doctl registry kubernetes-manifest --namespace "$NAMESPACE" | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NAMESPACE" \
            -p "{\"imagePullSecrets\": [{\"name\": \"registry-${REGISTRY##*/}\"}]}"
          cd manifests
          kustomize edit set image "lilsecret=$REGISTRY/$IMAGE:$SHA"
          kubectl apply -k .

      - name: Wait for rollout
        run: kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s
