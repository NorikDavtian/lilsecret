apiVersion: apps/v1
kind: Deployment
metadata:
  name: lilsecret-deployment
spec:
  replicas: 1
  # The data volume is ReadWriteOnce — never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lilsecret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lilsecret
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: lilsecret
          # Placeholder — the deploy pipeline points this at the real
          # registry (from .env / repo secrets) with kustomize at apply time.
          image: lilsecret
          ports:
            - containerPort: 8080
          env:
            # At-rest sealing key for the SQLite records. Lives only in this
            # Secret — never on the data volume it protects.
            - name: STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: lilsecret-storage
                  key: STORAGE_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lilsecret-data
---
kind: Service
apiVersion: v1
metadata:
  name: lilsecret
spec:
  selector:
    app.kubernetes.io/name: lilsecret
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
