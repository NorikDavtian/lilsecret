apiVersion: apps/v1
kind: Deployment
metadata:
  name: lilsecret-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lilsecret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lilsecret
    spec:
      containers:
        - name: lilsecret
          # Placeholder — the deploy pipeline points this at the real
          # registry (from .env / repo secrets) with kustomize at apply time.
          image: lilsecret
          ports:
            - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: lilsecret
spec:
  selector:
    app.kubernetes.io/name: lilsecret
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
