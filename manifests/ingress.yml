apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-lilsecret
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Ciphertext posts are base64-inflated; the app caps bodies at 1 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  tls:
    - hosts:
        - lilsecret.norik.io
      secretName: lilsecret-tls
  rules:
    - host: lilsecret.norik.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lilsecret
                port:
                  number: 80
  ingressClassName: nginx
